[build-system]
requires = ["setuptools>=68", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "qmb-fast"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "pandas", "matplotlib"]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipykernel", "nbclient"]
